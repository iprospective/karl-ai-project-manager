<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit karl-agent</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11161f; --panel2: #161c28; --line: #233044;
    --fg: #c8d3e0; --muted: #6b7a90; --accent: #4ea1ff; --ok: #3ad29f;
    --warn: #f5a742; --danger: #ff5d6c; --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.ko { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 49px); }
  .left { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; background: var(--panel); }
  .right { display: flex; flex-direction: column; min-width: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  textarea { font-family: var(--mono); resize: vertical; min-height: 56px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
    border-radius: 6px; padding: 7px 12px; font-size: 13px; font-family: inherit; transition: .12s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; font-weight: 600; width: 100%; margin-top: 14px; }
  button.primary:hover { filter: brightness(1.08); }
  button.mini { padding: 4px 9px; font-size: 12px; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  .sessions { list-style: none; margin: 0; padding: 0; }
  .sess { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 7px; margin-bottom: 8px; background: var(--panel2); }
  .sess.active { border-color: var(--accent); }
  .sess .rm { font-family: var(--mono); font-weight: 600; color: var(--accent); }
  .sess .meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--muted); }
  .badge.att { color: var(--ok); border-color: var(--ok); }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 2px; }
  .termbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .termbar .title { font-family: var(--mono); font-size: 13px; }
  iframe { border: 0; flex: 1; width: 100%; background: #000; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel2);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 14px;
    border-radius: 6px; font-size: 13px; max-width: 360px; opacity: 0; transform: translateY(8px);
    transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { border-left-color: var(--danger); }
  .lock { font-size: 11px; color: var(--warn); }
</style>
</head>
<body>
<header>
  <span class="dot" id="health"></span>
  <h1>Cockpit karl-agent</h1>
  <span class="sub" id="healthtxt">connexion…</span>
  <span style="flex:1"></span>
  <span class="lock" id="lock"></span>
</header>

<main>
  <section class="left">
    <div class="card" id="tokencard" style="display:none">
      <h2>Authentification</h2>
      <label for="token">X-Karl-Token</label>
      <input id="token" type="password" placeholder="token partagé">
      <button class="mini" style="margin-top:8px" onclick="saveToken()">Mémoriser</button>
    </div>

    <div class="card">
      <h2>Lancer une session</h2>
      <label for="rm">Ticket (RM id)</label>
      <input id="rm" type="number" inputmode="numeric" placeholder="ex : 1669" min="1">
      <label for="engine">Moteur</label>
      <select id="engine">
        <option value="claude">claude</option>
        <option value="shell">shell</option>
      </select>
      <label for="cwd">Répertoire de travail <span style="color:var(--muted)">(optionnel)</span></label>
      <input id="cwd" type="text" placeholder="/zfs/workspaces/…">
      <label for="prompt">Prompt initial <span style="color:var(--muted)">(optionnel)</span></label>
      <textarea id="prompt" placeholder="traite la tâche RM…"></textarea>
      <button class="primary" id="spawnbtn" onclick="spawn()">▶ Lancer &amp; attacher</button>
    </div>

    <div class="card">
      <h2>Sessions actives <span id="count" style="color:var(--muted)"></span></h2>
      <ul class="sessions" id="sessions"></ul>
    </div>
  </section>

  <section class="right">
    <div class="termbar">
      <span class="title" id="termtitle">Aucune session attachée</span>
      <span style="flex:1"></span>
      <button class="mini" id="reattach" style="display:none" onclick="reattach()">↻ Recharger</button>
      <button class="mini" id="detach" style="display:none" onclick="detach()">✕ Détacher</button>
    </div>
    <div class="placeholder" id="placeholder">
      Lance une session ou clique <b style="margin:0 4px">Attach</b> sur une session active<br>
      pour ouvrir son terminal ici (reprise de main : tu peux taper directement).
    </div>
    <iframe id="term" style="display:none"></iframe>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
let CFG = { ttyd_base: "", auth_required: false };
let attached = null;

function token() { return localStorage.getItem("karlToken") || ""; }
function saveToken() {
  localStorage.setItem("karlToken", document.getElementById("token").value.trim());
  toast("Token mémorisé"); refreshHealth(); refreshSessions();
}
function headers(extra) {
  const h = Object.assign({}, extra || {});
  if (CFG.auth_required && token()) h["X-Karl-Token"] = token();
  return h;
}
async function api(path, opts) {
  opts = opts || {};
  opts.headers = headers(opts.headers);
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || r.status + " " + r.statusText);
  return body;
}
function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", 3200);
}
function ttydUrl(rmId) {
  const base = CFG.ttyd_base || (location.protocol + "//" + location.hostname + ":7681");
  return base.replace(/\/+$/, "") + "/?arg=" + encodeURIComponent(rmId);
}
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "min";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "j";
}

async function refreshHealth() {
  const el = document.getElementById("health"), tx = document.getElementById("healthtxt");
  try {
    const h = await api("/health");
    el.className = "dot ok";
    tx.textContent = h.sessions + " session(s) · tmux " + (h.tmux ? "ok" : "absent");
  } catch (e) {
    el.className = "dot ko"; tx.textContent = "injoignable — " + e.message;
  }
}
async function refreshSessions() {
  const ul = document.getElementById("sessions"), cnt = document.getElementById("count");
  try {
    const { sessions } = await api("/sessions");
    cnt.textContent = sessions.length ? "(" + sessions.length + ")" : "";
    if (!sessions.length) { ul.innerHTML = '<div class="empty">aucune session</div>'; return; }
    sessions.sort((a, b) => Number(a.rm_id) - Number(b.rm_id));
    ul.innerHTML = "";
    for (const s of sessions) {
      const li = document.createElement("li");
      li.className = "sess" + (attached === s.rm_id ? " active" : "");
      li.innerHTML =
        '<span class="rm">RM' + s.rm_id + '</span>' +
        '<span class="meta">' + (s.created ? "depuis " + ago(s.created) : "") + '</span>' +
        (s.attached ? '<span class="badge att">attaché</span>' : '') +
        '<button class="mini" data-a="' + s.rm_id + '">Attach</button>' +
        '<button class="mini danger" data-k="' + s.rm_id + '">Kill</button>';
      ul.appendChild(li);
    }
    ul.querySelectorAll("[data-a]").forEach(b => b.onclick = () => attach(b.dataset.a));
    ul.querySelectorAll("[data-k]").forEach(b => b.onclick = () => kill(b.dataset.k));
  } catch (e) {
    ul.innerHTML = '<div class="empty">erreur : ' + e.message + '</div>';
  }
}

function attach(rmId) {
  attached = String(rmId);
  document.getElementById("placeholder").style.display = "none";
  const f = document.getElementById("term");
  f.style.display = "block"; f.src = ttydUrl(rmId);
  document.getElementById("termtitle").textContent = "karl-RM" + rmId + "  (terminal live — tape pour reprendre la main)";
  document.getElementById("detach").style.display = "";
  document.getElementById("reattach").style.display = "";
  refreshSessions();
}
function reattach() { if (attached) attach(attached); }
function detach() {
  attached = null;
  const f = document.getElementById("term");
  f.src = "about:blank"; f.style.display = "none";
  document.getElementById("placeholder").style.display = "flex";
  document.getElementById("termtitle").textContent = "Aucune session attachée";
  document.getElementById("detach").style.display = "none";
  document.getElementById("reattach").style.display = "none";
  refreshSessions();
}

async function spawn() {
  const rm = document.getElementById("rm").value.trim();
  if (!/^\d+$/.test(rm)) { toast("RM id requis (entier)", true); return; }
  const body = { rm_id: rm, engine: document.getElementById("engine").value };
  const cwd = document.getElementById("cwd").value.trim();
  const prompt = document.getElementById("prompt").value.trim();
  if (cwd) body.cwd = cwd;
  if (prompt) body.prompt = prompt;
  const btn = document.getElementById("spawnbtn");
  btn.disabled = true; btn.textContent = "Lancement…";
  try {
    await api("/spawn", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    toast("Session karl-RM" + rm + " lancée");
    document.getElementById("prompt").value = "";
    await refreshSessions(); refreshHealth();
    setTimeout(() => attach(rm), 400);
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = "▶ Lancer & attacher";
  }
}
async function kill(rmId) {
  if (!confirm("Fermer la session karl-RM" + rmId + " ? (le travail non sauvé est perdu)")) return;
  try {
    await api("/kill", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rm_id: String(rmId) }) });
    toast("Session karl-RM" + rmId + " fermée");
    if (attached === String(rmId)) detach();
    refreshSessions(); refreshHealth();
  } catch (e) { toast(e.message, true); }
}

(async function init() {
  try { CFG = await (await fetch("/cockpit-config")).json(); } catch (e) {}
  if (CFG.auth_required) {
    document.getElementById("tokencard").style.display = "";
    document.getElementById("lock").textContent = "🔒 auth requise";
    if (token()) document.getElementById("token").value = token();
  }
  document.getElementById("rm").addEventListener("keydown", e => { if (e.key === "Enter") spawn(); });
  refreshHealth(); refreshSessions();
  setInterval(refreshHealth, 5000);
  setInterval(refreshSessions, 3000);
})();
</script>
</body>
</html>
