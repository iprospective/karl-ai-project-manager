name: task-gogs-issues
version: 1.0.0
label: "Tickets · Gogs issues"
description: >
  Les issues d'un dépôt Gogs comme gestionnaire de tickets, en lecture. Gogs n'a pas d'API
  de pull request, ce qui a longtemps fait croire qu'il n'avait pas d'API du tout — les
  issues, elles, en ont une.
requires:
  - core >= 3.0
  - forge-gogs >= 1.0
provides:
  - {kind: provider, axis: task, type: gogs_issues}
