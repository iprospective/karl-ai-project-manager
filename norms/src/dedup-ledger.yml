  - reason: "Fusion staging=preprod (v1.36.0) + flux 2-branches/3-branches opt-in (RM2030) : le narratif MEP (workflow provisoire, montee preprod->prod, testeur humain, regression->a_corriger) et la config d'environnement (prod_branch: master / integration_branch: dev / preprod ; transitions a_mep->en_mep->ferme) sont reecrits — contenu conserve dans git-mep §Cycle dev->MEP, status-workflow (table transitions + diagramme) et environments (fusion staging/preprod)"
