# pm.config.yml — Configuration des chemins du système PM
#
# Couche d'abstraction permettant de déplacer le repo PM, déplacer le repo
# projets, ou réorganiser la structure interne, sans toucher au code des
# scripts ni à la doc des agents.
#
# Tous les scripts du repo PM (et les agents qui suivent les NORMS) doivent
# passer par scripts/pm_paths.py pour résoudre des chemins, jamais par
# concaténation manuelle ni hardcode du sous-dossier "clients/".
#
# Override local : créer pm.config.local.yml (gitignored) — la lib fusionne
# les deux, le local écrase les clés de ce fichier-ci.

schema_version: "1"

# ── Racines ───────────────────────────────────────────────────────────────
# pm_dir       : racine du repo project-management (ce repo-ci)
# projects_root: racine du repo ai-projects (données : clients/projets/tâches)
#
# Syntaxe d'interpolation :
#   ${VAR}          — variable d'environnement (depuis .env, obligatoire)
#   ${VAR:-default} — valeur par défaut si non définie
#   "auto"          — détecté à partir de l'emplacement du script
roots:
  pm_dir:        "${PM_DIR:-auto}"
  projects_root: "${PROJECTS_PATH}"
  # Racines FHS (RM2580) — séparent code / config / état / logs pour un install
  # RELOCALISABLE (paquet). Défaut "auto" = layout ACTUEL → 0 régression ; un
  # install packagé surcharge par env (ou pm.config.local.yml) :
  #   conf_dir  "auto" → = pm_dir          (config avec le code)  | /etc/mmi-pm
  #   state_dir "auto" → = {pm_dir}/var    (runtime : sessions…)  | /var/lib/mmi-pm/state
  #   log_dir   "auto" → = {state_dir}/log                        | /var/log/mmi-pm
  conf_dir:      "${PM_CONF_DIR:-auto}"
  state_dir:     "${PM_STATE_DIR:-auto}"
  log_dir:       "${PM_LOG_DIR:-auto}"

# ── Patterns de chemins ───────────────────────────────────────────────────
# Variables d'interpolation disponibles dans les patterns (str.format) :
#   {pm_dir} {projects_root}        — racines (résolues depuis `roots`)
#   {entity} {project}              — slugs passés en argument à .path()
#   {id} {slug}                     — pour task_file / task_log_file
#   {workspace_dir}                 — chemin du workspace de code (pour reverse_link)
#
# Les patterns peuvent se référencer entre eux par leur clé (résolution
# topologique : entity_projects_dir utilise {entity}, qui utilise
# {entities_dir}, etc.).
paths:
  # Niveau entité (client / produit / self)
  entities_dir:        "{projects_root}/clients"
  entity:              "{entities_dir}/{entity}"
  entity_client_dir:   "{entity}/client"
  entity_memory_dir:   "{entity}/memory"
  entity_projects_dir: "{entity}/projects"
  entity_used_dir:     "{entity}/projects_used"

  # Niveau projet
  project:             "{entity_projects_dir}/{project}"
  project_dir:         "{project}/project"   # CANONIQUE : overview.md + environments.md (couche mathieu-pm stricte, mutation via mmi-pm)
  docs_dir:            "{project}/docs"      # aspects-docs LIBRES (wiki-syncés, group-writable mathieu) — cf. RM2043 / CDC privsep §5
  project_memory_dir:  "{project}/memory"
  tasks_dir:           "{project}/tasks"

  # Niveau tâche
  task_file:           "{tasks_dir}/RM{id}_{slug}.md"
  task_log_file:       "{tasks_dir}/RM{id}_{slug}.log.md"

  # Routage des emails entrants → client/projet (RM2669). Table adresse →
  # client/projet : de la CONFIGURATION, donc sous `conf_dir` (= le repo de code
  # par défaut, où elle est versionnée). Surtout PAS sous `projects_root` : ce
  # dossier est `.gitignore`d côté code et n'est le checkout d'aucun dépôt de
  # données — la table y serait ni versionnée ni sauvegardée. Aucun contenu
  # d'email ne s'en approche (la file de triage, elle, reste hors git — RM2668).
  mail_routing_file:   "{conf_dir}/mail-routing.yml"

  # Annuaire de contacts (RM2703) — une fiche par personne, `contacts/<ref>.yml`.
  # Ni sous `conf_dir` : le dépôt de CODE part sur un miroir GitHub PUBLIC, et
  # ce sont des données personnelles (noms, adresses, téléphones). Ni à la racine
  # de `projects_root`, que ne versionne aucun dépôt (cf. la note de
  # `mail_routing_file`). Donc dans le dépôt de DONNÉES, sous le projet système
  # — privé, versionné, et lisible depuis n'importe quel client.
  contacts_dir:        "{entities_dir}/iprospective/projects/pm-ai-agents/contacts"

  # Sauvegarde ZFS de la machine (RM3023) — l'empreinte du dernier passage.
  # Sous `state_dir`, qui vit sur /zfs/workspaces : le tick tourne sur l'HÔTE
  # (seul endroit où `zfs` existe) mais le contrôle qui le surveille tourne dans
  # le conteneur. Les deux ne se voient que par ce montage partagé.
  zfs_backup_stamp:    "{state_dir}/zfs-backup.json"

  # Symlinks de liaison code ↔ PM
  # workspace_link  : côté PM, pointe vers le workspace de code
  # reverse_link    : côté workspace de code, pointe vers le projet PM
  workspace_link:      "{project}/workspace"
  reverse_link:        "{workspace_dir}/.mmi-pm"



# ── Courrier (RM3024) ─────────────────────────────────────────────────────
# Nos domaines. Ils servent à NE PAS prendre une de nos propres adresses pour
# un indice de client dans le routage entrant (RM2669) : le gabarit de création
# pose une adresse maison chez CHAQUE client, elle n'identifie donc personne.
#
# L'annuaire (`contacts/`) dit qui est des nôtres **adresse par adresse**, y
# compris hors domaine ; ces domaines couvrent ce qui n'y figure pas encore —
# un alias fraîchement créé, une boîte de service. Surcharge d'instance :
# KARL_MAIL_OWN_DOMAINS.
mail:
  own_domains:
    - iprospective.fr
    - iprospective.net

# ── Sauvegarde ZFS de la machine (RM3023) ─────────────────────────────────
# Le 2026-09-06, /home n'avait AUCUN snapshot depuis avril 2025 et aucune
# sauvegarde externe : 42 transcripts de session effacés par la rétention de
# Claude Code étaient définitivement irrécupérables (RM2997).
#
# Pas de timer dédié : le tick se greffe sur un processus qui tourne déjà
# (`pm-task-report`, cron de l'hôte toutes les 30 min). Sur un portable, un
# horaire fixe manquerait la moitié des créneaux de toute façon ; ce qui compte
# est « le dernier snapshot a-t-il plus d'une heure ? », pas « est-il minuit ? ».
zfs_backup:
  # Datasets sauvegardés. Récursif : `zfs/root` couvre /home et /root.
  datasets:
    - zfs/root          # /home (57 G) + /root — le trou qui a coûté RM2997
    - zfs/workspaces    # 162 G — le code est dans git, le WIP ne l'est pas
    - zfs/lxc/dev       # 25 G — le conteneur de travail
    - zfs/documents     # 55 G — irremplaçables
  # Volontairement dehors, et pourquoi :
  #   zfs/lxc/ai      221 G de poids de modèles, retéléchargeables
  #   zfs/nextcloud   service avec son propre cycle de sauvegarde
  #   zfs/swap zfs/tmp zfs/test   sans contenu à conserver
  #
  # Chaque seau : période minimale entre deux prises, et nombre gardé.
  # 24 h d'heures + 2 semaines de jours + 2 mois de semaines + 6 mois de mois.
  buckets:
    hourly:  {every_minutes: 60,     keep: 24}
    daily:   {every_minutes: 1440,   keep: 14}
    weekly:  {every_minutes: 10080,  keep: 8}
    monthly: {every_minutes: 43200,  keep: 6}
  # Âge au-delà duquel le contrôle d'environnement passe au rouge.
  stale_hours: 26

# ── Manager IA — supervision des agents (cf. RM1734) ──────────────────────
# L'humain qui supervise les agents IA : reçoit les notifs mail de livraison,
# se voit assigner les tickets en `a_tester_verifier` quand l'auteur est karl.
#
# V1 : un seul manager global (Mathieu). V2 prévue : cascade par projet
# (section `ia.managers:` par paths.project) puis champ `ia_manager:` dans
# le frontmatter de project/overview.md.
ia:
  default_manager:
    redmine_id: 5
    email: mathieu@iprospective.fr
    name: Mathieu Moulin

# ── Notifications — mails émis par les scripts PM ─────────────────────────
# Interrupteur global des notifs email (via karl-mail-send.py), ex.
# pm-task-status-update → mail au demandeur sur changement de statut.
# Désactivé par défaut : exige vault-agentd déverrouillé et génère du bruit
# tant que le flux n'est pas calibré. Le flag --no-mail par appel reste
# utilisable pour couper ponctuellement même une fois activé ici.
notifications:
  email_enabled: false

# ── Traçabilité — note Redmine par commit (cf. NORMS § « Unité de traçabilité ») ──
# Niveau auquel un commit rattaché à une tâche déclenche une note Redmine.
# Permet de calibrer le bruit à l'usage (mode `all` = test/observation).
#   work : commits de travail/livraison/structurants uniquement (défaut) —
#          les commits d'outillage (`pm(*):`, `chore(…):`) reportent sans note
#   all  : tout commit rattaché à une tâche (mesurer le bruit réel)
#   none : aucune note auto par commit (.log.md + time_entry conservés)
# Override par projet : même clé dans le meta.yml du projet (RM2409).
# Appliqué par le hook scripts/pm-post-commit.py.
traceability:
  commit_note_level: work

# ── Auto-commit git des scripts pm-* (RM1834 piste A) ─────────────────────
# Chaque script pm-* committe (et pousse) atomiquement les fichiers qu'il
# vient d'écrire — `git commit -- <chemins>` sous verrou local, non-fatal
# (un échec n'interrompt jamais l'opération principale). Plus de staging
# manuel dans l'arbre partagé multi-sessions. Override par appel : --no-commit.
git:
  autocommit: true
  autopush: true
  # RM2298 : branche d'intégration du repli d'auto-push — quand la branche
  # courante est protégée (RM2030), pm_git pousse HEAD:<integration_branch> au
  # lieu de différer indéfiniment ; promotion par lot via pm-promote.py.
  integration_branch: dev
  # RM3209 — d'où partent les worktrees, où vont les envs. Réglages d'INSTANCE, réservés à l'admin : ils se lisent
  # ici et dans pm.config.local.yml (qui prime), jamais dans l'environnement. Résolveur : scripts/pm_worktrees.py.
  #   worktree_source : central  → dépôt partagé <workspace>/repos/<repo>.git
  #                     per_user → le dépôt de chaque dev, <dossier des dépôts>/<repo> ; le dossier se règle PAR
  #                                UTILISATEUR (PM_REPOS_DIR dans var/users/<user>/.env, défaut ~/repos)
  #   envs_layout     : project  → <workspace>/envs/<env>
  #                     user     → <workspace>/envs/<utilisateur>/<env>
  # Déplacer des envs existants vers la disposition retenue : mmi-pm env-relocate --plan <fichier>.
  worktree_source: central
  envs_layout: project

# ── Runtime des envs de workspace (RM1834 / RM1947 F1) ─────────────────────
# Ops privilégiées (vhost Apache, BDD, purge logs) déléguées au helper
# fail-closed `tools/env-runtime/pm-env-helper.sh` déployé sur la box de dev
# (sudo NOPASSWD). Consommé par scripts/pm-env-session.py.
# workspace_map : traduction chemin host → chemin vu par la box (bind-mounts).
env_runtime:
  ssh_host: mathieu@dev.lxc
  helper: /usr/local/sbin/pm-env-helper
  # hooks D1/D2 (pm-task-status-update) : en_cours → create l'env de session,
  # ferme → teardown. Ne concerne que les workspaces au layout RM1993 mono-repo.
  auto_session: true
  log_dir: /var/log/php
  workspace_map:
    # bind-mount à l'identique host ↔ dev.lxc (mapping identité ; le mécanisme
    # sert pour une box dont le point de montage diffère)
    /zfs/workspaces: /zfs/workspaces

# ── Budget de contexte par rôle (RM1943) ──────────────────────────────────
# Plafond (≈ tokens, octets/3.6) du contexte TOUJOURS-CHARGÉ d'une session :
# pont AGENTS.md + CLAUDE.md PM + KERNEL + modules préchargés du rôle +
# worker-common + addendum rôle (hors cascade client/projet, variable).
# Mesure : scripts/pm-context-budget.py --all-roles ; garde-fou anti-régression
# vérifié par pm-norms-doctor (--check). Référence 2026-06-13 : worker-dev
# 21,2k (avant RM1922 : 39,5k). Resserrer les plafonds = réduire les
# préchargements de modules (premier levier : status-workflow 5,6k).
# 2026-06-19 (RM2046) : plafond relevé 24000 → 32768 pour donner de la marge
# (worker-dev ~24,3k après tripwire #4 + pm-token-check) ; le garde-fou reste
# actif, on resserrera si besoin.
context:
  budget_tokens:
    # RM2582 : ramené de 34000 après dégraissage. Le mode d'emploi et les cas
    # particuliers de git-mep / status-workflow sont sortis de la précharge (ils
    # s'ouvrent par déclencheur) : worker-dev est passé de 33k à ~24,2k. Le
    # plafond garde ~20 % de marge — assez pour écrire une règle sans tout
    # rejouer, trop peu pour laisser la dérive s'installer sans qu'on la voie.
    default: 29000
    # RM3238 — dette ASSUMÉE (arbitrage Mathieu, 2026-09-18) : « je préfère que les directives
    # soient enregistrées correctement ». La règle « pas de MEP prod avec une question non
    # tranchée » vit en entier dans git-mep (préchargé), pas en renvoi d'une ligne : worker-infra
    # passe ~29,1k. Plafond relevé pour CE rôle seulement ; résorption par dégraissage : RM3035.
    worker-infra: 30000
    # Même arbitrage, une fois RM3228 (statut etude_chiffrage_a_corriger) et RM3238 combinés sur dev :
    # worker-dev précharge les deux règles et passe ~29,0k. Résorption : RM3035.
    worker-dev: 30000
    project_docs: 20000   # cascade docs/ par projet (RM2368) — lecture via INDEX.md

# ── Providers par projet — registre de serveurs (RM2530 / P0 RM2542) ────────
# Fondation de la généralisation forge → axes task / forge / doc / secret.
# INERTE par défaut : les défauts reproduisent l'état actuel (Redmine global +
# GitLab + Vaultwarden iProspective), aucun script existant n'en change de
# comportement (câblage task/forge/doc = P1+ ; l'axe secret est consommé par le
# chantier multi-vault RM2662).
#
#   axes          : axes ACTIFS en plus des livrés (task/forge/doc/secret).
#                   Un axe futur (monitoring…) se déclare ICI, sans toucher au code.
#   servers.<nom> : une instance déclarée — { axis, type, url, <options…> }
#                   AUCUN secret ici (URLs + type seulement) ; les identifiants
#                   sont résolus par instance/dev (P4/RM2546 ; pour l'axe secret :
#                   SECRET__<slug>__* dans var/users/<user>/.env). url accepte
#                   l'interpolation ${VAR} / ${VAR:-defaut} (comme roots).
#   defaults.<axe>: instance retenue quand ni le projet ni le client ne surchargent.
#
# Un projet — ou un CLIENT, pour tous ses projets — peut déclarer PLUSIEURS
# providers sur un axe (RM2653, chantier RM2626) : `providers.<axe>` accepte une
# **liste** — un `role: primary` (obligatoire, unique : la source de vérité PM)
# puis N `role: secondary` (gestionnaires partenaires), chacun portant ses règles
# `link:` / `sync:` :
#
#   providers:
#     task:
#       - {instance: redmine-ipro, role: primary, project_id: mon-projet}
#       - {instance: redmine-matnat, role: secondary, project_id: 12,
#          link: {policy: required}, sync: {pull: {notes: true}}}
#
# Clés API par instance (jamais ici) : REDMINE__<INSTANCE>__API_KEY dans
# var/users/<user>/.env — repli sur les clés globales si l'instance déclarée EST
# l'instance de travail.
#
# Résolution : scripts/pm_registry.py :: resolve_instances(project_meta, axis,
# registry, client_meta) — projet > legacy projet > client > défaut ; liste avec le
# primaire en tête. resolve_instance(…) = le primaire seul.
providers:
  # axes: [monitoring]        # exemple : activer un axe supplémentaire
  # erp (RM2891) : la facturation. Dolibarr y est un provider comme Redmine pour les
  # tickets : un client qui a le sien pourra un jour le désigner, sans toucher au code.
  axes: [erp]
  defaults:
    task:   redmine-ipro
    forge:  gitlab-ipro
    doc:    redmine-wiki
    secret: vw-ipro
    llm:    lemonade-strix        # RM3067 : le modèle de travail de karl — local d'abord
    erp:    dolibarr-ipro         # RM2891 : factures, tiers, tarifs
  servers:
    # — axe erp (RM2891). Secret : DOLIBARR__DOLIBARR_IPRO__API_KEY, posé par
    #   `pm-provider-secret --instance dolibarr-ipro --key API_KEY` (valeur sur stdin).
    dolibarr-ipro:  { axis: erp, type: dolibarr, url: "${DOLIBARR_URL:-https://erp.iprospective.fr}" }
    # — axe llm (RM3067) : les modèles que karl appelle pour un travail MACHINE (tri des tours d'un
    #   transcript, classification, résumé) — à ne pas confondre avec le modèle qui tient la session.
    #   Local d'abord : les transcripts portent le travail des clients, ils n'ont pas à sortir de la
    #   machine, et une passe ne coûte alors rien. Le cloud reste déclarable, en repli.
    #   `type` : lemonade | ollama | openai (tout serveur à l'API OpenAI : vLLM, LM Studio, llama.cpp)
    #            | anthropic (API) | claude-cli (`claude -p`, refacture son prompt système à chaque appel).
    #   Clé éventuelle par instance : LLM__<INSTANCE>__API_KEY dans var/users/<user>/.env, jamais ici.
    lemonade-strix: { axis: llm, type: lemonade, url: "${LEMONADE_URL:-http://strix.lan:8000/api/v1}",
                      model: qwen3-8b, note: "Ryzen AI (Strix Halo), API OpenAI" }
    ollama-strix:   { axis: llm, type: ollama,   url: "${OLLAMA_HOST:-http://strix.lan:11434}",
                      model: "qwen3:8b" }
    ollama-local:   { axis: llm, type: ollama,   url: "http://localhost:11434", model: "qwen3:8b" }
    claude-cli:     { axis: llm, type: claude-cli, model: "claude-haiku-4-5-20251001",
                      note: "repli sans clé ni serveur ; le CLI refacture son prompt système à chaque appel" }

    # — axe forge —
    # `ssh_aliases:` = alias `~/.ssh/config` par lesquels les remotes atteignent
    # cette instance (RM2766). Nécessaire, pas cosmétique : les remotes passent
    # massivement par des alias qui portent le port et la clé — `gitlab:owner/repo`,
    # `ssh://gogs@matnat-tools/…`. L'URL d'un tel remote ne dit RIEN de la forge
    # (`matnat-tools` = 127.0.0.1:28022) ; l'alias déclaré ici, si. Sans lui, le
    # rattachement « ce dépôt appartient à telle forge » reste impossible.
    gitlab-ipro:    { axis: forge, type: gitlab, url: "${GITLAB_URL:-https://gitlab.iprospective.fr}",
                      ssh_aliases: [gitlab, gitlab-mmi, mmi-gitlab, git] }
    gogs-matnat:    { axis: forge, type: gogs,   url: "https://gogs.materiaux-naturels.fr", ssh_port: 28022,
                      ssh_aliases: [matnat-tools, matnat-git, matnat-gogs] }
    github-public:  { axis: forge, type: github, url: "https://github.com",
                      ssh_aliases: [github] }
    # — axe task —
    # `slug:` = identifiant COURT et stable du gestionnaire, utilisé dans les
    # références compactes de tickets (CF « Réf ticket outil externe » : 16 car.,
    # ex. `matnat#5576`). Déclaré plutôt que déduit du nom d'instance : renommer
    # une instance ne doit pas invalider des références déjà écrites (RM2657).
    # Absent → déduction (on retire le préfixe de type : redmine-matnat → matnat).
    redmine-ipro:   { axis: task,  type: redmine, slug: ipro,   url: "${REDMINE_URL:-https://tasks.iprospective.fr}" }
    redmine-matnat: { axis: task,  type: redmine, slug: matnat, url: "https://tasks.materiaux-naturels.fr" }
    # — axe doc —
    redmine-wiki:   { axis: doc,   type: redmine_wiki, url: "${REDMINE_URL:-https://tasks.iprospective.fr}" }
    nc-ipro:        { axis: doc,   type: nextcloud, url: "https://cloud.iprospective.fr" }
    # — axe secret (vaults, RM2662) — le défaut reproduit l'existant.
    # Les secrets CLIENTS restent dans une collection `<client>-agents` de ce
    # vault (cf. CDC RM2662 § 3.2 bis) ; déclarer une autre instance sert aux
    # intervenants qui ont leur propre outil, ou à un client qui impose le sien.
    vw-ipro:        { axis: secret, type: vaultwarden, url: "${VAULT_URL:-https://vault.iprospective.fr}" }
    # Exemple — base KeePass locale (RM2684). Décommenter et adapter le chemin ;
    # dépendance : `sudo apt install python3-pykeepass`. Déverrouillage :
    # `scripts/unlock-vault.sh -i kdbx-perso` (passphrase, jamais écrite).
    # kdbx-perso:   { axis: secret, type: keepass, file: "~/vaults/ipro.kdbx" }
    # Exemple — fichier YAML chiffré par age (RM2713), pour le cas « on me partage
    # trois identifiants » : ni serveur ni compte. Dépendance : `sudo apt install age`.
    # La CLÉ PRIVÉE ne se déclare jamais ici : SECRET__AGE_ACME__AGE_KEY_FILE dans
    # ton .env, fichier en 0600. Diagnostic : `scripts/unlock-vault.sh -i age-acme`.
    # age-acme:     { axis: secret, type: age, file: "~/vaults/acme.yml.age" }
    # Exemple — coffre d'une instance Nextcloud portant l'app Passwords (RM2712).
    # Identifiants dans ton .env : SECRET__NCPW_MATNAT__USER et __TOKEN (un mot de
    # passe d'APPLICATION Nextcloud, révocable — pas celui du compte).
    # Diagnostic : `scripts/unlock-vault.sh -i ncpw-matnat`.
    # ncpw-matnat:  { axis: secret, type: nextcloud_passwords, url: "https://cloud.materiaux-naturels.fr" }
    # Exemple — 1Password via la CLI `op` et un *service account* (RM2711). La
    # CLI n'est pas dans les dépôts Debian (dépôt APT 1Password) et un service
    # account suppose un plan payant. Le JETON ne se déclare jamais ici :
    # SECRET__OP_IPRO__SERVICE_ACCOUNT_TOKEN dans ton .env — il est passé à `op`
    # par l'environnement, jamais en argument (`ps` le montrerait).
    # `vault:` est le coffre par défaut ; l'URI peut le surcharger
    # (secret://op-ipro/<coffre>/<item>#champ).
    # Diagnostic : `scripts/unlock-vault.sh -i op-ipro`.
    # op-ipro:      { axis: secret, type: onepassword, vault: "Agents" }

# ── Interface du cockpit — mise en page / design front (RM2386) ─────────────
# Rubrique « Design front » du panneau Réglages (whitelist RM2213). Ces clés
# pilotent l'apparence du cockpit web, pas le comportement du système PM.
# Surcharge par instance dans pm.config.local.yml (posée depuis le cockpit) ;
# surcharge par navigateur via l'encart « ce navigateur » (localStorage).
ui:
  # dark | light | auto (auto = prefers-color-scheme du navigateur)
  theme: auto

# ── Sessions d'agents (cockpit karl) ──────────────────────────────────────
# Plafond mémoire des scopes systemd `tmux-spawn-*.scope` (RM2690). Sans lui,
# une session qui fuit sature la machine et c'est le kernel qui choisit la
# victime — pas forcément le fautif (incident OOM du 2026-08-13, 15,7 Go).
# Rubrique « Sessions » du panneau 🔧 réglages du cockpit (whitelist RM2213) ;
# surcharge par instance dans pm.config.local.yml (posée depuis le cockpit).
# Ne s'applique qu'aux sessions créées ENSUITE (les scopes vivantes gardent
# leur réglage). `KARL_AGENT_MEM_HIGH` / `KARL_AGENT_MEM_MAX` /
# `KARL_AGENT_MEM_SWAP` dans le .env FIGENT ces valeurs (le cockpit refuse
# alors l'écriture).
sessions:
  # GiB (systemd compte en puissances de 1024) ; 0 = pas de limite.
  memory_high_gib: 6    # seuil de pression : throttling + reclaim, pas de kill
  memory_max_gib: 8     # plafond dur : au-delà, OOM-kill de la SEULE scope
  # ⚠ Convention INVERSE pour le swap : 0 = aucun swap (plafond réel),
  # -1 = illimité. Sans swap, une session qui fuit meurt à memory_max au lieu
  # de saturer le swap et de faire ramer le poste pendant la montée
  # high → max — c'est le scénario du 2026-08-13 (6 Go de swap saturés).
  memory_swap_gib: 0

# ── Options de lancement des moteurs d'agent (RM3108) ─────────────────────────
#
# Le CATALOGUE des options vit dans le code (`karl-agent.py :: ENGINES`) : il dépend
# du binaire installé, pas de la machine. Ici, l'instance se contente de COCHER ou
# DÉCOCHER, et d'ajouter ses propres arguments. Une option absente garde son défaut,
# ce qui permet d'en ajouter au code sans toucher aux instances existantes.
#
# Aperçu de ce qui sera réellement lancé, moteur par moteur :
#   curl -s localhost:8765/engines | python3 -m json.tool
#
# Les options s'appliquent au lancement d'une session NEUVE comme à la REPRISE d'une
# conversation : les deux passent par `engine_base_cmd`.
engines:
  claude:
    options:
      # Les connecteurs MCP du compte (Ahrefs, Notion, Gmail, Drive…) injectent leurs
      # noms d'outils et les instructions de leurs serveurs dans CHAQUE session :
      # 8 179 tokens mesurés le 2026-09-11, payés au démarrage puis relus à chaque
      # appel d'outil. Une session PM n'en utilise aucun. Décocher (false) pour une
      # session qui a besoin d'un connecteur.
      no_mcp: true
    # Arguments libres, ajoutés tels quels après les options cochées. Ce que PM pose
    # lui-même (--model, --session-id, --resume) y est REFUSÉ : ce serait un doublon.
    extra_args: ""

# Point de restauration pré-MEP (RM2989, tripwire #10) — consommé par pm-snapshot.
# PM ne touche aucun hôte : le snapshot est pris par atlas (ops svc-status /
# svc-snapshot, RM3254) via le canal orchestrateur. Les nœuds sont tous interrogés ;
# il faut exactement UNE instance up, sinon rien n'est exécuté.
snapshot:
  nodes: [srv3, srv4, srv5]
  rid: "sync#root_hour"
  atlas_orch_host: "atlas-orch@atlas.iprospective.net"
  atlas_orch_key: "~/.ssh/id_ed25519_karl"

# Filtres Sieve par ManageSieve (RM3171) — consommé par pm-sieve. Identifiants lus
# du vault (jamais en argv/environ/sortie). Sauvegardes : <state_dir>/sieve-backups/.
sieve:
  host: mail.iprospective.net
  port: 4190
  account: karl@iprospective.fr          # boîte par défaut
  accounts:                              # boîte → item Vaultwarden (mêmes identifiants que l'IMAP)
    karl@iprospective.fr: "vaultwarden://iprospective/iprospective-agents/karl@mail.iprospective.net"
