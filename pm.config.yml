# pm.config.yml — Configuration des chemins du système PM
#
# Couche d'abstraction permettant de déplacer le repo PM, déplacer le repo
# projets, ou réorganiser la structure interne, sans toucher au code des
# scripts ni à la doc des agents.
#
# Tous les scripts du repo PM (et les agents qui suivent les NORMS) doivent
# passer par scripts/pm_paths.py pour résoudre des chemins, jamais par
# concaténation manuelle ni hardcode du sous-dossier "clients/".
#
# Override local : créer pm.config.local.yml (gitignored) — la lib fusionne
# les deux, le local écrase les clés de ce fichier-ci.

schema_version: "1"

# ── Racines ───────────────────────────────────────────────────────────────
# pm_dir       : racine du repo project-management (ce repo-ci)
# projects_root: racine du repo ai-projects (données : clients/projets/tâches)
#
# Syntaxe d'interpolation :
#   ${VAR}          — variable d'environnement (depuis .env, obligatoire)
#   ${VAR:-default} — valeur par défaut si non définie
#   "auto"          — détecté à partir de l'emplacement du script
roots:
  pm_dir:        "${PM_DIR:-auto}"
  projects_root: "${PROJECTS_PATH}"
  # Racines FHS (RM2580) — séparent code / config / état / logs pour un install
  # RELOCALISABLE (paquet). Défaut "auto" = layout ACTUEL → 0 régression ; un
  # install packagé surcharge par env (ou pm.config.local.yml) :
  #   conf_dir  "auto" → = pm_dir          (config avec le code)  | /etc/mmi-pm
  #   state_dir "auto" → = {pm_dir}/var    (runtime : sessions…)  | /var/lib/mmi-pm/state
  #   log_dir   "auto" → = {state_dir}/log                        | /var/log/mmi-pm
  conf_dir:      "${PM_CONF_DIR:-auto}"
  state_dir:     "${PM_STATE_DIR:-auto}"
  log_dir:       "${PM_LOG_DIR:-auto}"

# ── Patterns de chemins ───────────────────────────────────────────────────
# Variables d'interpolation disponibles dans les patterns (str.format) :
#   {pm_dir} {projects_root}        — racines (résolues depuis `roots`)
#   {entity} {project}              — slugs passés en argument à .path()
#   {id} {slug}                     — pour task_file / task_log_file
#   {workspace_dir}                 — chemin du workspace de code (pour reverse_link)
#
# Les patterns peuvent se référencer entre eux par leur clé (résolution
# topologique : entity_projects_dir utilise {entity}, qui utilise
# {entities_dir}, etc.).
paths:
  # Niveau entité (client / produit / self)
  entities_dir:        "{projects_root}/clients"
  entity:              "{entities_dir}/{entity}"
  entity_client_dir:   "{entity}/client"
  entity_memory_dir:   "{entity}/memory"
  entity_projects_dir: "{entity}/projects"
  entity_used_dir:     "{entity}/projects_used"

  # Niveau projet
  project:             "{entity_projects_dir}/{project}"
  project_dir:         "{project}/project"   # CANONIQUE : overview.md + environments.md (couche mathieu-pm stricte, mutation via mmi-pm)
  docs_dir:            "{project}/docs"      # aspects-docs LIBRES (wiki-syncés, group-writable mathieu) — cf. RM2043 / CDC privsep §5
  project_memory_dir:  "{project}/memory"
  tasks_dir:           "{project}/tasks"

  # Niveau tâche
  task_file:           "{tasks_dir}/RM{id}_{slug}.md"
  task_log_file:       "{tasks_dir}/RM{id}_{slug}.log.md"

  # Routage des emails entrants → client/projet (RM2669). Table adresse →
  # client/projet : de la CONFIGURATION, donc sous `conf_dir` (= le repo de code
  # par défaut, où elle est versionnée). Surtout PAS sous `projects_root` : ce
  # dossier est `.gitignore`d côté code et n'est le checkout d'aucun dépôt de
  # données — la table y serait ni versionnée ni sauvegardée. Aucun contenu
  # d'email ne s'en approche (la file de triage, elle, reste hors git — RM2668).
  mail_routing_file:   "{conf_dir}/mail-routing.yml"

  # Symlinks de liaison code ↔ PM
  # workspace_link  : côté PM, pointe vers le workspace de code
  # reverse_link    : côté workspace de code, pointe vers le projet PM
  workspace_link:      "{project}/workspace"
  reverse_link:        "{workspace_dir}/.mmi-pm"

# ── Manager IA — supervision des agents (cf. RM1734) ──────────────────────
# L'humain qui supervise les agents IA : reçoit les notifs mail de livraison,
# se voit assigner les tickets en `a_tester_verifier` quand l'auteur est karl.
#
# V1 : un seul manager global (Mathieu). V2 prévue : cascade par projet
# (section `ia.managers:` par paths.project) puis champ `ia_manager:` dans
# le frontmatter de project/overview.md.
ia:
  default_manager:
    redmine_id: 5
    email: mathieu@iprospective.fr
    name: Mathieu Moulin

# ── Notifications — mails émis par les scripts PM ─────────────────────────
# Interrupteur global des notifs email (via karl-mail-send.py), ex.
# pm-task-status-update → mail au demandeur sur changement de statut.
# Désactivé par défaut : exige vault-agentd déverrouillé et génère du bruit
# tant que le flux n'est pas calibré. Le flag --no-mail par appel reste
# utilisable pour couper ponctuellement même une fois activé ici.
notifications:
  email_enabled: false

# ── Traçabilité — note Redmine par commit (cf. NORMS § « Unité de traçabilité ») ──
# Niveau auquel un commit rattaché à une tâche déclenche une note Redmine.
# Permet de calibrer le bruit à l'usage (mode `all` = test/observation).
#   work : commits de travail/livraison/structurants uniquement (défaut)
#   all  : tout commit rattaché à une tâche (mesurer le bruit réel)
#   none : aucune note auto par commit (.log.md + time_entry conservés)
traceability:
  commit_note_level: work

# ── Auto-commit git des scripts pm-* (RM1834 piste A) ─────────────────────
# Chaque script pm-* committe (et pousse) atomiquement les fichiers qu'il
# vient d'écrire — `git commit -- <chemins>` sous verrou local, non-fatal
# (un échec n'interrompt jamais l'opération principale). Plus de staging
# manuel dans l'arbre partagé multi-sessions. Override par appel : --no-commit.
git:
  autocommit: true
  autopush: true
  # RM2298 : branche d'intégration du repli d'auto-push — quand la branche
  # courante est protégée (RM2030), pm_git pousse HEAD:<integration_branch> au
  # lieu de différer indéfiniment ; promotion par lot via pm-promote.py.
  integration_branch: dev

# ── Runtime des envs de workspace (RM1834 / RM1947 F1) ─────────────────────
# Ops privilégiées (vhost Apache, BDD, purge logs) déléguées au helper
# fail-closed `tools/env-runtime/pm-env-helper.sh` déployé sur la box de dev
# (sudo NOPASSWD). Consommé par scripts/pm-env-session.py.
# workspace_map : traduction chemin host → chemin vu par la box (bind-mounts).
env_runtime:
  ssh_host: mathieu@dev.lxc
  helper: /usr/local/sbin/pm-env-helper
  # hooks D1/D2 (pm-task-status-update) : en_cours → create l'env de session,
  # ferme → teardown. Ne concerne que les workspaces au layout RM1993 mono-repo.
  auto_session: true
  log_dir: /var/log/php
  workspace_map:
    # bind-mount à l'identique host ↔ dev.lxc (mapping identité ; le mécanisme
    # sert pour une box dont le point de montage diffère)
    /zfs/workspaces: /zfs/workspaces

# ── Budget de contexte par rôle (RM1943) ──────────────────────────────────
# Plafond (≈ tokens, octets/3.6) du contexte TOUJOURS-CHARGÉ d'une session :
# pont AGENTS.md + CLAUDE.md PM + KERNEL + modules préchargés du rôle +
# worker-common + addendum rôle (hors cascade client/projet, variable).
# Mesure : scripts/pm-context-budget.py --all-roles ; garde-fou anti-régression
# vérifié par pm-norms-doctor (--check). Référence 2026-06-13 : worker-dev
# 21,2k (avant RM1922 : 39,5k). Resserrer les plafonds = réduire les
# préchargements de modules (premier levier : status-workflow 5,6k).
# 2026-06-19 (RM2046) : plafond relevé 24000 → 32768 pour donner de la marge
# (worker-dev ~24,3k après tripwire #4 + pm-token-check) ; le garde-fou reste
# actif, on resserrera si besoin.
context:
  budget_tokens:
    # RM2582 : ramené de 34000 après dégraissage. Le mode d'emploi et les cas
    # particuliers de git-mep / status-workflow sont sortis de la précharge (ils
    # s'ouvrent par déclencheur) : worker-dev est passé de 33k à ~24,2k. Le
    # plafond garde ~20 % de marge — assez pour écrire une règle sans tout
    # rejouer, trop peu pour laisser la dérive s'installer sans qu'on la voie.
    default: 29000
    project_docs: 20000   # cascade docs/ par projet (RM2368) — lecture via INDEX.md

# ── Providers par projet — registre de serveurs (RM2530 / P0 RM2542) ────────
# Fondation de la généralisation forge → axes task / forge / doc / secret.
# INERTE par défaut : les défauts reproduisent l'état actuel (Redmine global +
# GitLab + Vaultwarden iProspective), aucun script existant n'en change de
# comportement (câblage task/forge/doc = P1+ ; l'axe secret est consommé par le
# chantier multi-vault RM2662).
#
#   axes          : axes ACTIFS en plus des livrés (task/forge/doc/secret).
#                   Un axe futur (monitoring…) se déclare ICI, sans toucher au code.
#   servers.<nom> : une instance déclarée — { axis, type, url, <options…> }
#                   AUCUN secret ici (URLs + type seulement) ; les identifiants
#                   sont résolus par instance/dev (P4/RM2546 ; pour l'axe secret :
#                   SECRET__<slug>__* dans ~/.config/mmi-pm/.env). url accepte
#                   l'interpolation ${VAR} / ${VAR:-defaut} (comme roots).
#   defaults.<axe>: instance retenue quand ni le projet ni le client ne surchargent.
#
# Résolution : scripts/pm_registry.py :: resolve_instance(project_meta, axis,
# registry, client_meta) — projet > legacy projet > client > défaut.
providers:
  # axes: [monitoring]        # exemple : activer un axe supplémentaire
  defaults:
    task:   redmine-ipro
    forge:  gitlab-ipro
    doc:    redmine-wiki
    secret: vw-ipro
  servers:
    # — axe forge —
    gitlab-ipro:    { axis: forge, type: gitlab, url: "${GITLAB_URL:-https://gitlab.iprospective.fr}" }
    gogs-matnat:    { axis: forge, type: gogs,   url: "https://gogs.materiaux-naturels.fr", ssh_port: 28022 }
    github-public:  { axis: forge, type: github, url: "https://github.com" }
    # — axe task —
    redmine-ipro:   { axis: task,  type: redmine, url: "${REDMINE_URL:-https://tasks.iprospective.fr}" }
    redmine-matnat: { axis: task,  type: redmine, url: "https://tasks.materiaux-naturels.fr" }
    # — axe doc —
    redmine-wiki:   { axis: doc,   type: redmine_wiki, url: "${REDMINE_URL:-https://tasks.iprospective.fr}" }
    nc-ipro:        { axis: doc,   type: nextcloud, url: "https://cloud.iprospective.fr" }
    # — axe secret (vaults, RM2662) — le défaut reproduit l'existant.
    # Les secrets CLIENTS restent dans une collection `<client>-agents` de ce
    # vault (cf. CDC RM2662 § 3.2 bis) ; déclarer une autre instance sert aux
    # intervenants qui ont leur propre outil, ou à un client qui impose le sien.
    vw-ipro:        { axis: secret, type: vaultwarden, url: "${VAULT_URL:-https://vault.iprospective.fr}" }
    # Exemple — base KeePass locale (RM2684). Décommenter et adapter le chemin ;
    # dépendance : `sudo apt install python3-pykeepass`. Déverrouillage :
    # `scripts/unlock-vault.sh -i kdbx-perso` (passphrase, jamais écrite).
    # kdbx-perso:   { axis: secret, type: keepass, file: "~/vaults/ipro.kdbx" }

# ── Interface du cockpit — mise en page / design front (RM2386) ─────────────
# Rubrique « Design front » du panneau Réglages (whitelist RM2213). Ces clés
# pilotent l'apparence du cockpit web, pas le comportement du système PM.
# Surcharge par instance dans pm.config.local.yml (posée depuis le cockpit) ;
# surcharge par navigateur via l'encart « ce navigateur » (localStorage).
ui:
  # dark | light | auto (auto = prefers-color-scheme du navigateur)
  theme: auto

# ── Sessions d'agents (cockpit karl) ──────────────────────────────────────
# Plafond mémoire des scopes systemd `tmux-spawn-*.scope` (RM2690). Sans lui,
# une session qui fuit sature la machine et c'est le kernel qui choisit la
# victime — pas forcément le fautif (incident OOM du 2026-08-13, 15,7 Go).
# Rubrique « Sessions » du panneau 🔧 réglages du cockpit (whitelist RM2213) ;
# surcharge par instance dans pm.config.local.yml (posée depuis le cockpit).
# Ne s'applique qu'aux sessions créées ENSUITE (les scopes vivantes gardent
# leur réglage). `KARL_AGENT_MEM_HIGH` / `KARL_AGENT_MEM_MAX` /
# `KARL_AGENT_MEM_SWAP` dans le .env FIGENT ces valeurs (le cockpit refuse
# alors l'écriture).
sessions:
  # GiB (systemd compte en puissances de 1024) ; 0 = pas de limite.
  memory_high_gib: 6    # seuil de pression : throttling + reclaim, pas de kill
  memory_max_gib: 8     # plafond dur : au-delà, OOM-kill de la SEULE scope
  # ⚠ Convention INVERSE pour le swap : 0 = aucun swap (plafond réel),
  # -1 = illimité. Sans swap, une session qui fuit meurt à memory_max au lieu
  # de saturer le swap et de faire ramer le poste pendant la montée
  # high → max — c'est le scénario du 2026-08-13 (6 Go de swap saturés).
  memory_swap_gib: 0
