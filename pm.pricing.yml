  # Sonnet — équilibre coût/performance (usage quotidien)
  # ⚠ Sonnet 5 : tarif INTRODUCTIF 2/10 en vigueur jusqu'au 2026-08-31 inclus.
  #   À partir du 2026-09-01 : repasser à 3.00 / 15.00 / 0.30 / 3.75.
  #   (la veille RM2165 détectera l'écart, mais autant l'anticiper)
  claude-sonnet-5:
    input_per_mtok_usd:            2.00
