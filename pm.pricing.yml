# pm.pricing.yml — Tarification des modèles Anthropic en USD par MTok
#
# Source : https://docs.claude.com/en/docs/about-claude/models (vérifier
# régulièrement, les prix sont à maintenir manuellement).
# Dernière mise à jour : 2026-07-08 (RM2163 — ajout Fable 5 / Sonnet 5,
# correction Opus 4.5+ : le tarif Opus est passé à 5/25 dès Opus 4.5,
# les anciennes valeurs 15/75 dataient d'Opus 4.0/4.1).
#
# Unités : USD par 1 000 000 tokens (MTok), arrondies au cent près.
# Cache read = ~10× moins cher que input (lookup en mémoire serveur).
# Cache creation = ~25% plus cher que input (écriture initiale en cache).

schema_version: "1"

# ── Modèles Claude actuels ─────────────────────────────────────────────────
models:
