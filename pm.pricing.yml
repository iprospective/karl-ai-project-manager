# pm.pricing.yml — Tarification des modèles Anthropic en USD par MTok
#
# Source : https://platform.claude.com/docs/en/about-claude/pricing (table
# « Model pricing » — vérifier régulièrement, les prix sont à maintenir
# manuellement ; la veille quotidienne est outillée par RM2165).
# Dernière mise à jour : 2026-07-31 (RM2342 — ajout claude-opus-5 et
# claude-mythos-5, tarif intro Sonnet 5 appliqué, ajout claude-opus-4-1).
# Historique : 2026-07-08 (RM2163 — ajout Fable 5 / Sonnet 5, correction
# Opus 4.5+ : le tarif Opus est passé à 5/25 dès Opus 4.5, les anciennes
# valeurs 15/75 dataient d'Opus 4.0/4.1).
#
# Unités : USD par 1 000 000 tokens (MTok), arrondies au cent près.
# Multiplicateurs officiels, relatifs au tarif input de base :
#   cache read (hit)        = 0,1×   input
#   cache creation (5 min)  = 1,25×  input   ← ce que mesure le hook pm-task-tick
#   cache creation (1 h)    = 2×     input   (non modélisé : le PM n'utilise pas le TTL 1 h)
#
# ⚠ Un modèle ABSENT de cette table est facturé 0 par compute_cost_usd() —
#   silencieusement. Tout nouveau modèle doit y être ajouté le jour où il est
#   utilisé (incidents : RM2163 pour fable-5, RM2342 pour opus-5).
# ⚠ Le « fast mode » (Opus 5 / Opus 4.8) est facturé 10/50 au lieu de 5/25, mais
#   l'API renvoie le MÊME identifiant de modèle : une session en fast mode est
#   donc sous-évaluée d'un facteur 2. Non modélisable ici en l'état.

schema_version: "1"

# ── Modèles Claude actuels ─────────────────────────────────────────────────
models:
  # Fable 5 / Mythos 5 — tier le plus capable, au-dessus d'Opus
  # (Mythos 5 = mêmes specs et mêmes tarifs, accès Project Glasswing)
  claude-fable-5:
    input_per_mtok_usd:           10.00
    output_per_mtok_usd:           50.00
    cache_read_per_mtok_usd:        1.00
    cache_creation_per_mtok_usd:   12.50
  claude-mythos-5:
    input_per_mtok_usd:           10.00
    output_per_mtok_usd:           50.00
    cache_read_per_mtok_usd:        1.00
    cache_creation_per_mtok_usd:   12.50

  # Opus 5 — modèle courant des sessions Claude Code (défaut depuis 2026-07)
  claude-opus-5:
    input_per_mtok_usd:            5.00
    output_per_mtok_usd:           25.00
    cache_read_per_mtok_usd:        0.50
    cache_creation_per_mtok_usd:    6.25

  # Opus 4.x — haut de gamme (5/25 depuis Opus 4.5 ; 4.0/4.1 étaient à 15/75)
  claude-opus-4-8:
    input_per_mtok_usd:            5.00
    output_per_mtok_usd:           25.00
    cache_read_per_mtok_usd:        0.50
    cache_creation_per_mtok_usd:    6.25
  claude-opus-4-7:
    input_per_mtok_usd:            5.00
    output_per_mtok_usd:           25.00
    cache_read_per_mtok_usd:        0.50
    cache_creation_per_mtok_usd:    6.25
  claude-opus-4-6:
    input_per_mtok_usd:            5.00
    output_per_mtok_usd:           25.00
    cache_read_per_mtok_usd:        0.50
    cache_creation_per_mtok_usd:    6.25
  claude-opus-4-5:
    input_per_mtok_usd:            5.00
    output_per_mtok_usd:           25.00
    cache_read_per_mtok_usd:        0.50
    cache_creation_per_mtok_usd:    6.25
  # Opus 4.1 — déprécié (retrait 2026-08-05), tarif historique 15/75
  claude-opus-4-1:
    input_per_mtok_usd:           15.00
    output_per_mtok_usd:           75.00
    cache_read_per_mtok_usd:        1.50
