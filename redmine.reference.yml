# redmine.reference.yml — Référence canonique de la config Redmine (instance iProspective)
#
# Source unique de vérité pour les IDs Redmine sur lesquels le système PM se lie
# (custom fields, statuts, trackers, priorités, activités de saisie de temps).
# Les IDs sont propres à l'instance, mutables, et un ID périmé fait échouer
# silencieusement un POST/PUT (cf. knowledge/redmine/gotchas.md).
#
# `scripts/redmine-config-check.py` diffe ce fichier contre la config live de
# l'instance et signale tout drift (NORMS § « Synchronisation de la configuration
# Redmine »). Régénérer un squelette depuis le live :
#     scripts/redmine-config-check.py --dump > /tmp/live.yml
#
# Seuls les éléments réellement *bindés* par le code/les NORMS figurent ici —
# pas l'intégralité des énumérations de l'instance. Ajouter une entrée quand un
# script commence à dépendre d'un nouvel ID.

instance: https://tasks.iprospective.fr

# ── Custom fields (id → définition attendue) ──────────────────────────────────
# `type` = customized_type Redmine (issue | time_entry | group).
# NB : ne pas nommer cette clé `on` — YAML 1.1 la parse comme le booléen True.
custom_fields:
  15: {name: "IA",                  format: list,        type: issue,      used_by: "REDMINE_CF_IA_ID (.env) ; filtrage IA (NORMS)"}
  11: {name: "Raison Fermé",        format: enumeration, type: issue,      used_by: "CF_RAISON_FERME_ID ; close_reason (redmine-post-note, pm-task-sync)"}
  17: {name: "Tokens passés",       format: int,         type: issue,      used_by: "cumul tokens_total (RM1806)"}
  21: {name: "Tokens prévus",       format: int,         type: issue,      used_by: "estimate.tokens (RM1806)"}
  22: {name: "Temps estimé IA (h)", format: float,       type: issue,      used_by: "estimate.ai_time_minutes ÷ 60 (RM1806)"}
  25: {name: "LLM prévu",           format: enumeration, type: issue,      used_by: "estimate.estimated_model → palier (RM1806 ; cf. llm_tiers)"}
  16: {name: "Tokens",              format: int,         type: time_entry, used_by: "delta tokens par saisie de temps/commit (RM1806)"}
  27: {name: "AI Test par agent",   format: enumeration, type: issue,      used_by: "REDMINE_CF_AGENT_TEST_ID (.env) ; requires_agent_test (routing dev→test ; cf. agent_test_values)"}
  3:  {name: "GIT Branche",         format: string,      type: issue,      used_by: "branche de ticket <RMid>-<slug> (pm-branch-start, RM1923)"}
  4:  {name: "GIT PR",              format: link,        type: issue,      used_by: "URL de la MR de livraison (RM1820 string→link)"}
  14: {name: "Environnement de test", format: link,      type: issue,      used_by: "URL de l'environnement de test (RM1820 string→link)"}

# ── CF27 « AI Test par agent » — faut-il une passe agent-testeur indépendante ──
# Mapping frontmatter `requires_agent_test` → value id d'énumération Redmine.
# Vide / non sélectionné côté Redmine = `default` (hérite du défaut projet →
# défaut système : `non`). Cf. NORMS § « Passe agent-testeur (requires_agent_test) ».
agent_test_values:
  oui:      39
  non:      40
  demander: 41

# ── CF25 « LLM prévu » — paliers de capacité (énumération) ─────────────────────
# Valeurs d'énumération Redmine (value id → label) et mapping depuis le nom de
# modèle de `estimate.estimated_model`. `model_match` : sous-chaîne (casse
# insensible) du nom de modèle → value id. Premier match gagne ; sinon CF25 non
# poussé (warning).
llm_tiers:
  values:
    34: "Very High (Opus...)"
    35: "High (Mistral mediium, Sonnet...)"
    36: "Medium (DeepSeek...)"
    37: "Light (Qwen 27b)"
    38: "Very Light (Quen 4b)"
  model_match:
    opus:     34
    sonnet:   35
    haiku:    36
    deepseek: 36
    mistral:  35
    qwen:     37

# ── Statuts (status NORMS → id Redmine) ───────────────────────────────────────
# Source canonique = NORMS.md § « Synchronisation des statuts MD ↔ Redmine »
# (table NORMS↔Redmine). Les scripts (redmine-post-note, pm-task-status-update)
# lisent ce bloc via redmine_utils.status_map() — ne plus hardcoder ailleurs.
statuses:
  nouveau:                  1    # "Nouveau"  (statut d'entrée : ticket créé non encore trié)
  a_etudier_chiffrer:       8    # "A étudier / Qualifier"
  etude_chiffrage_en_cours: 14   # "Etude/CDC en cours"
  etude_chiffrage_a_valider: 21  # "Etude/CDC à valider"  (étude/CDC finie → validation par le demandeur)
  a_faire:                  12   # "A Faire"
  en_cours:                 2    # "En cours"
  a_tester_dev:             19   # "A tester/vérifier dev"        (test par testeur ≠ dev)
  a_tester_demandeur:       9    # "A tester/vérifier demandeur"  (validation par l'author)
  a_mep:                    3    # "Résolu/Validé/A MEP"          (non terminal ≠ ferme)
  en_mep:                   20   # "MEP/Tester en preprod"
  en_pause:                 13   # "Attente retour / en pause"
  a_corriger:               11   # "A corriger/finir"
  ferme:                    18   # "Fermé"  (seul statut clos ; la nuance de raison
                                 #  est portée par le CF 11 « Raison Fermé »)

# Alias dépréciés (acceptés en lecture, normalisés vers le statut canonique).
# `a_tester_verifier` (≤ NORMS v1.18.0) → `a_tester_demandeur`.
status_aliases:
  a_tester_verifier: a_tester_demandeur

# ── Trackers (type NORMS → id) ────────────────────────────────────────────────
# Source de vérité = pm-task-add.py::TYPE_TO_TRACKER.
trackers:
  bugfix:     1   # "Anomalie"
  feature:    2   # "Evolution"
  assistance: 3   # "Assistance"
  autre:      4   # "Tâche"  (infrastructure/maintenance/documentation/research/autre y retombent)
  # research = audit/analyse (investigation, audit, exploration) ; pas de tracker
  # dédié côté Redmine → retombe sur "Tâche". La nature fine est portée par
  # l'activité de temps "Audit/Analyse" (cf. type_to_activity) et, à terme, le CF
  # 20 "Task type" (TODO : créer la valeur enum "Audit/Analyse" puis task_type_cf).

# ── Priorités (priorité NORMS → id) ───────────────────────────────────────────
# Source de vérité = pm-task-add.py::PRIORITY_TO_ID.
priorities:
  low:    1   # "Bas"
  normal: 2   # "Normal"
  high:   3   # "Haut"
  urgent: 4   # "Urgent"

# ── Activités de saisie de temps (id → nom) ───────────────────────────────────
# Utilisées par RM1806/RM1819 pour qualifier le time_entry d'un commit selon le
# type de travail. Seules les activités effectivement choisies par l'outillage
# figurent ici.
activities:
  9:  "Développement"               # dev générique (ni feature/refacto/debug ciblé)
  31: "Developpement/Feature"       # fonctionnalité neuve (créée RM1819 ; nom sans accent côté instance)
  16: "Développement/Debug"         # correction de défaut
  30: "Développement/Refacto/Clean" # refacto / nettoyage de code (créée RM1819)
  13: "SysAdmin/Conf/Debug"
  10: "Audit/Analyse"
  11: "Assistance"
  18: "Autre"

# ── Convention type de tâche NORMS → activité de temps (RM1819) ────────────────
# Quand un report de temps (time_entry) est créé pour un commit / une étape, son
# `activity_id` est dérivé du `type` de la tâche selon cette table. Cohérente
# avec le travail réel de karl (l'agent) : la *nature* du travail, distincte du
# *tracker* (qui encode la catégorie de ticket). Source unique : ne pas
# redupliquer en dur — `redmine_utils.activity_for_type()` lit ce bloc (fallback
# `autre`). Surchargagle par saisie via `pm-task-report.py --activity <id>`.
type_to_activity:
  feature:        31   # Developpement/Feature        — écrire une fonctionnalité neuve
  bugfix:         16   # Développement/Debug          — corriger un défaut
  refactoring:    30   # Développement/Refacto/Clean  — refonte de code
  security:       16   # Développement/Debug          — correctif de sécurité
  performance:    30   # Développement/Refacto/Clean  — optimisation
  maintenance:    30   # Développement/Refacto/Clean  — refacto, nettoyage, entretien
  infrastructure: 13   # SysAdmin/Conf/Debug          — déploiement, conteneurs, systemd, conf
  research:       10   # Audit/Analyse                — investigation, exploration
  audit:          10   # Audit/Analyse                — audit / analyse
  documentation:  10   # Audit/Analyse                — lecture/analyse + rédaction de doc (pas d'activité dédiée)
  design:         18   # Autre                        — conception (pas d'activité dédiée)
  assistance:     11   # Assistance                   — aide / support ponctuel
  autre:          18   # Autre                        — fourre-tout (défaut)

# ── CF 20 « Task type » — taxonomie fine iProspective (NORMS type → valeur) ────
# Le *tracker* encode la catégorie *coarse* (Anomalie/Evolution/Assistance/Tâche).
# Quand le type NORMS est plus fin que le tracker (ex. `documentation` retombe sur
# le tracker « Tâche »), on porte le détail dans ce CF enumeration. Posé à la
# création par pm-task-add quand le type a une correspondance ici. Source unique :
# lue par `redmine_utils.task_type_cf()` — ne pas redupliquer en dur.
task_type_cf:
  id: 20               # CF « Task type » (enumeration, issue)
  values:
    documentation: 42  # "Documentation"
