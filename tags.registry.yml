# tags.registry.yml — registre du CF Redmine « Tags » (RM2829/RM2836, chantier RM2828)
#
# DEUX rôles, à ne pas confondre :
#
#   `values`  — le VOCABULAIRE CONTRÔLÉ. Ce que le CF accepte, et donc la seule
#               chose qui monte dans Redmine. Chaque entrée porte l'`id` de la
#               valeur côté Redmine : le CF est en format `enumeration`, l'API
#               désigne ses valeurs par id (jamais par libellé).
#   `aliases` — le MAPPING n-1 des mots-clés existants vers ces valeurs. Le champ
#               `tags:` des frontmatters porte 747 mots-clés accumulés ; les
#               regrouper évite d'avoir à réécrire l'historique, et `pm-task-tag`
#               canonicalise à l'écriture.
#
# Ce qui n'est NI une valeur NI un alias reste un mot-clé purement local : il vit
# au frontmatter (filtres `pm-task-list --tag`, recherche cockpit) et ne monte pas.
# C'est le cas voulu pour les noms de produits ou composants mono-projet
# (`cockpit`, `karl`, `karl-agent`, `norms`, `graph`, `atlas`…).
#
# ⚠ SYNCHRONISATION. Les valeurs possibles ne se créent pas par API (les
# définitions de CF sont en lecture seule) : on les ajoute dans l'UI admin
# Redmine, puis on recopie leur id ici. `pm-tags-audit.py` compare le CF live, ce
# registre et les usages réels, et dit exactement ce qui manque de chaque côté.
# Une valeur sans `id` est « en attente » : elle est acceptée à l'écriture locale
# mais ne peut pas être poussée, et l'outillage le dit plutôt que d'échouer.
cf:
  id: 32
  name: Tags
  format: enumeration
  multiple: true

values:
  # — créées côté Redmine (id connu) —
  - {slug: front, label: "Front", id: 45}
  - {slug: db, label: "DB", id: 46}
  - {slug: refacto, label: "Refacto", id: 47}
  - {slug: bo, label: "BO", id: 48}
  - {slug: config, label: "Config", id: 49}
  - {slug: debug, label: "Debug", id: 50}
  - {slug: tunnel-de-commande, label: "Tunnel de commande", id: 51}
  # — proposées, EN ATTENTE de création dans l'UI admin (RM2836) —
  #   volumes mesurés sur les frontmatters au 2026-08-26 (usages · projets)
  - {slug: securite, label: "Sécurité"}        # 135 · 26
  - {slug: outillage, label: "Outillage"}      # 176 ·  8
  - {slug: infra, label: "Infra"}              # 146 · 23
  - {slug: git, label: "Git"}                  # 122 · 23
  - {slug: bootstrap, label: "Bootstrap"}      #  69 · 22
  - {slug: migration, label: "Migration"}      #  64 · 11
  - {slug: monitoring, label: "Monitoring"}    #  64 ·  7
  - {slug: deploiement, label: "Déploiement"}  #  56 · 13
  - {slug: mail, label: "Mail"}                #  56 ·  5
  - {slug: doc, label: "Doc"}                  #  44 ·  8
  - {slug: architecture, label: "Architecture"} # 30 · 10
