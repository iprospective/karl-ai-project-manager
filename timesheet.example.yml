# timesheet.yml — configuration de la feuille de temps (RM2890).
#
# Copier en `timesheet.yml` à la racine du core PM et adapter : ce fichier décrit
# UNE instance (ses postes, ses clients, ses absences), il n'est pas portable.
# Sans lui, la feuille de temps tourne avec les défauts et les sources de cette machine.
#
# Détail des règles : docs/cdc-rm2890-timesheet-heures-humaines.md (pm-ai-agents).

# ── Où lire les traces ───────────────────────────────────────────────────────
# Rien n'est deviné : un gisement non déclaré reste invisible. Le travail ne se
# fait pas que sur un poste (l'hôte et le conteneur partagent les transcripts par
# bind mount ; un compte distant en porte d'autres).
sources:
  - {kind: claude-transcripts, path: "~/.claude/projects"}
  - {kind: claude-history,     path: "~/.claude/history.jsonl"}
  - {kind: opencode-db,        path: "~/.local/share/opencode/opencode.db"}
  # base opencode de l'hôte, exportée par : sqlite3 <db> ".backup <cible>"
  # - {kind: opencode-db, path: "/zfs/workspaces/var/opencode-host.db"}
  #
  # Source DISTANTE (rapatriée par SSH dans var/timesheet/cache/ à chaque run ;
  # une source injoignable est signalée et ignorée, elle ne bloque pas le calcul) :
  # - kind: claude-history
  #   host: "dercya-www@dev"
  #   path: "~/.claude/history.jsonl"
  #   # Compte PARTAGÉ : ces journées sont celles d'un autre intervenant.
  #   # Rien n'est deviné — un tri automatique sur du temps facturable, non.
  #   exclude_days: ["2026-06-09", "2026-07-21", "2026-07-23"]
  #   # ou l'inverse : only_days: [...]
  #
  # Actions sur les tickets d'un Redmine (créations, commentaires, changements de
  # statut) : des gestes humains horodatés, à cible certaine. C'est la seule source
  # qui voit une journée de régie, où le travail se trace chez le client.
  # - kind: redmine-actions
  #   instance: redmine-matnat      # nom du registre providers ; absent = instance principale
  #   user_id: 3                    # l'utilisateur SUR CETTE instance
  #   project_map:                  # projet Redmine distant → (client, projet PM)
  #     infrastructure: [matnat, infra]
  #     sites: [matnat, site_sf7]
  #     "*": [matnat, infra]        # défaut pour les autres projets

# ── Chemins → (client, projet) ───────────────────────────────────────────────
# Indispensable pour les répertoires d'un AUTRE hôte (pas de `.mmi-pm` là-bas) et
# pour les chemins renommés depuis. Le préfixe le plus long gagne.
path_map:
  # "/home/siteadm/dercya/public": [pisceen, pisceen-presta]
  # "/zfs/workspaces/pisceen/erp": [pisceen, dolibarr]        # ancien nom
  # "/zfs/workspaces/matnat/sf7":  [matnat, site_sf7]         # ancien nom

# ── Entités PERSONNELLES ─────────────────────────────────────────────────────
# Ni refacturées, ni versées au pot transversal : c'est du temps à soi.
perso:
  - lemathou

# ── Travaux servant plusieurs clients ────────────────────────────────────────
# Clé de répartition d'une entité ou d'un projet mutualisé.
multi_client:
  sfy:
    - {client: pisceen,  weight: 70}
    - {client: calicote, weight: 30}

# ── Absences ─────────────────────────────────────────────────────────────────
# Sur ces périodes, tout est proposé NON COMPTÉ — mais les journées où une
# activité cliente réelle est détectée sont remontées en évidence dans le
# rapport, jamais supprimées en silence.
absences:
  - {du: 2026-06-22, au: 2026-07-19, motif: "congé paternité"}

# ── Journées de régie (présence chez un client) ──────────────────────────────
# Une journée sur site ne laisse presque rien dans les traces : on y travaille
# autrement (réunions, écran partagé, poste du client). Une présence déclarée pose
# un PLANCHER : si le mesuré du jour est en dessous, l'écart est ajouté en ligne de
# complément. Si le mesuré dépasse, rien n'est ajouté — on ne rabote pas du réel.
# C'est la seule étape qui crée du temps : le rapport la montre à part.
presences:
  - client: matnat
    projet: infra
    jours: [mercredi]
    debut: "09:30"       # la plage de présence sur site…
    fin: "18:30"
    heures: 8            # …dont 8 h travaillées (1 h de pause)
    reunion_h: 1         # dont réunion hebdomadaire, en ligne distincte
    depuis: 2026-08-01
    exclusif: true       # la journée est presque exclusivement pour ce client :
                         # ce que la mesure attribue ailleurs pendant la plage est
                         # rapatrié (et tracé dans le rapport)
    garder: [lemathou]   # …sauf ces entités, laissées telles quelles
    # Une journée hors du moule se SURCHARGE (elle garde son plancher, ajusté)
    # plutôt que de s'annuler : sans plancher, elle retombe au mesuré, qui est
    # précisément ce qu'on sait faux les jours de régie.
    exceptions:
      "2026-08-12": {heures: 3, reunion_h: 1, exclusif: false}   # télétravail, réunion du matin
    # sauf: ["2026-09-02"]   # journée à ignorer complètement (absent, malade…)
    # dates: ["2026-09-03"]   # ou des dates explicites plutôt qu'un jour de semaine

# ── Réglages du calcul ───────────────────────────────────────────────────────
follow_cap: 10            # plafond du temps de suivi après une demande (minutes)
work_start_hour: 8        # plage ouvrée : seule fenêtre où le transversal se refacture
work_end_hour: 19
client_threshold_min: 60  # en deçà, la journée n'est pas « cliente » → transversal écarté
quantum_min: 15           # tranche d'arrondi des lignes

# ── Écriture dans Redmine ────────────────────────────────────────────────────
user_id: 5                # les saisies sont créées au nom de cet utilisateur
# Instances Redmine SUPPLÉMENTAIRES à interroger pour la déduction : un client
# peut avoir la sienne, et ce qu'on y a déjà saisi ne doit pas être re-proposé.
# (l'`instance` est un nom du registre `providers.servers` de pm.config.yml)
redmine_instances:
  - {instance: redmine-matnat, user_id: 3}
activity_id: 9            # activité par défaut (« Développement »)
# Cibles des lignes SANS ticket : projet Redmine par "<client>/<projet PM>".
project_map:
  # "pisceen/dolibarr": pisceen-dolibarr
